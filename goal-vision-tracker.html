<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Goal & Vision Tracker — The No-Fluff Toolkit</title>
<style>
  :root {
    --navy: #1f2d3a; --navy-deep: #142029; --stone: #f4efe4; --stone-line: #ddd4bf;
    --teal: #2f5d62; --gold: #c9a227; --ink: #2a2a28;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--stone); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 26px; flex-wrap: wrap; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 30px; margin: 0 0 4px; color: var(--navy-deep); font-weight: 600; }
  .subhead { margin: 0; color: #5c6b63; font-size: 14.5px; max-width: 520px; }
  .brand { font-size: 12px; letter-spacing: 0.3px; color: #8a8574; text-align: right; }
  .brand b { color: var(--navy); }
  .panel { background: #fff; border: 1px solid var(--stone-line); border-radius: 12px; padding: 20px 22px; margin-bottom: 20px; }
  .row { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .row input { flex: 1; padding: 9px 12px; border: 1px solid var(--stone-line); border-radius: 8px; font-size: 14px; }
  button { font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 8px; border: 1px solid transparent; padding: 10px 16px; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover { background: var(--navy-deep); }
  .btn-ghost { background: #fff; color: var(--navy); border-color: var(--stone-line); }
  .btn-small { padding: 6px 10px; font-size: 12.5px; }

  .goal-card { border: 1px solid var(--stone-line); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; background: #fbf9f4; }
  .goal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px; }
  .goal-name { font-weight: 700; font-size: 16px; color: var(--navy-deep); font-family: Georgia, serif; }
  .goal-target { font-size: 12.5px; color: #7a8177; }
  .remove-link { font-size: 12px; color: #a34a3a; cursor: pointer; white-space: nowrap; }

  .progress-track { background: #ece5d4; border-radius: 6px; height: 10px; overflow: hidden; margin: 10px 0; }
  .progress-fill { background: var(--teal); height: 100%; border-radius: 6px; transition: width 0.2s; }
  .progress-pct { font-size: 12.5px; color: var(--teal); font-weight: 700; }

  .milestone-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f0ece0; }
  .milestone-row input[type="checkbox"] { width: 16px; height: 16px; }
  .milestone-row span { flex: 1; font-size: 14px; }
  .milestone-row span.done { text-decoration: line-through; color: #9a9484; }
  .ms-remove { font-size: 11px; color: #a34a3a; cursor: pointer; }

  .add-milestone-row { display: flex; gap: 8px; margin-top: 8px; }
  .add-milestone-row input { flex: 1; padding: 7px 10px; border: 1px solid var(--stone-line); border-radius: 6px; font-size: 13px; }

  .footer-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; flex-wrap: wrap; gap: 12px; }
  .save-note { font-size: 12.5px; color: #8a9089; }
  .export-buttons { display: flex; gap: 10px; }

  @media print {
    .row, button, .footer-actions, header .brand, .remove-link, .add-milestone-row, .ms-remove, input[type="checkbox"] { display: none !important; }
    .panel { border: none; padding: 0; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>The Goal & Vision Tracker</h1>
      <p class="subhead">Break each goal into real milestones and watch your progress bar move as you actually complete them — not a vision board you write once and never open again.</p>
    </div>
    <div class="brand">A resource from<br><b>The No-Fluff Toolkit</b></div>
  </header>

  <div class="panel">
    <div class="row">
      <input type="text" id="goalName" placeholder="Goal name (e.g. Launch my Etsy shop)" />
      <input type="text" id="goalTarget" placeholder="Target date (e.g. Dec 2026)" style="max-width:180px;" />
      <button class="btn-primary" id="addGoal">Add goal</button>
    </div>
  </div>

  <div id="goalsContainer"></div>

  <div class="footer-actions">
    <div class="save-note" id="saveNote">Auto-saves in this browser as you go.</div>
    <div class="export-buttons">
      <button class="btn-ghost" id="exportCsv">Export data (CSV)</button>
      <button class="btn-primary" id="exportPdf">Download PDF</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "nofluff_goal_tracker_v1";
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || { goals: [] };

function uid() { return Math.random().toString(36).slice(2, 9); }
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  document.getElementById('saveNote').textContent = "Saved to this browser • " + new Date().toLocaleTimeString();
}

function pctFor(goal) {
  if (!goal.milestones.length) return 0;
  const done = goal.milestones.filter(m => m.done).length;
  return Math.round((done / goal.milestones.length) * 100);
}

function render() {
  const container = document.getElementById('goalsContainer');
  container.innerHTML = '';

  if (!state.goals.length) {
    container.innerHTML = '<div class="panel" style="color:#9a9484;">Add a goal above to start breaking it into milestones.</div>';
    return;
  }

  state.goals.forEach(g => {
    const pct = pctFor(g);
    const card = document.createElement('div');
    card.className = 'goal-card';

    let msHtml = '';
    g.milestones.forEach(m => {
      msHtml += `
        <div class="milestone-row">
          <input type="checkbox" data-goal="${g.id}" data-ms="${m.id}" ${m.done ? 'checked' : ''}>
          <span class="${m.done ? 'done' : ''}">${m.text}</span>
          <span class="ms-remove" data-goal-ms-remove="${g.id}:${m.id}">✕</span>
        </div>
      `;
    });

    card.innerHTML = `
      <div class="goal-head">
        <div>
          <div class="goal-name">${g.name}</div>
          <div class="goal-target">${g.target ? 'Target: ' + g.target : 'No target date set'}</div>
        </div>
        <span class="remove-link" data-remove="${g.id}">Remove goal</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-pct">${pct}% complete (${g.milestones.filter(m => m.done).length}/${g.milestones.length} milestones)</div>
      <div style="margin-top:10px;">${msHtml}</div>
      <div class="add-milestone-row">
        <input type="text" placeholder="Add a milestone" data-add-ms="${g.id}">
        <button class="btn-ghost btn-small" data-add-ms-btn="${g.id}">Add</button>
      </div>
    `;
    container.appendChild(card);
  });

  container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const goal = state.goals.find(g => g.id === cb.dataset.goal);
      const ms = goal.milestones.find(m => m.id === cb.dataset.ms);
      ms.done = cb.checked;
      save(); render();
    });
  });

  container.querySelectorAll('[data-remove]').forEach(link => {
    link.addEventListener('click', () => {
      state.goals = state.goals.filter(g => g.id !== link.dataset.remove);
      save(); render();
    });
  });

  container.querySelectorAll('[data-goal-ms-remove]').forEach(link => {
    link.addEventListener('click', () => {
      const [goalId, msId] = link.dataset.goalMsRemove.split(':');
      const goal = state.goals.find(g => g.id === goalId);
      goal.milestones = goal.milestones.filter(m => m.id !== msId);
      save(); render();
    });
  });

  container.querySelectorAll('[data-add-ms-btn]').forEach(btn => {
    btn.addEventListener('click', () => addMilestone(btn.dataset.addMsBtn));
  });
  container.querySelectorAll('[data-add-ms]').forEach(inp => {
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') addMilestone(inp.dataset.addMs); });
  });
}

function addMilestone(goalId) {
  const input = document.querySelector(`[data-add-ms="${goalId}"]`);
  const text = input.value.trim();
  if (!text) return;
  const goal = state.goals.find(g => g.id === goalId);
  goal.milestones.push({ id: uid(), text, done: false });
  save(); render();
}

document.getElementById('addGoal').addEventListener('click', () => {
  const nameInput = document.getElementById('goalName');
  const targetInput = document.getElementById('goalTarget');
  const name = nameInput.value.trim();
  if (!name) return;
  state.goals.push({ id: uid(), name, target: targetInput.value.trim(), milestones: [] });
  nameInput.value = ''; targetInput.value = '';
  save(); render();
});

document.getElementById('exportCsv').addEventListener('click', () => {
  let csv = 'Goal,Target Date,Milestone,Completed\n';
  state.goals.forEach(g => {
    if (!g.milestones.length) { csv += `"${g.name}","${g.target}",,\n`; return; }
    g.milestones.forEach(m => { csv += `"${g.name}","${g.target}","${m.text}",${m.done ? 'Yes' : 'No'}\n`; });
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'goal-vision-tracker.csv';
  a.click();
});

document.getElementById('exportPdf').addEventListener('click', () => window.print());

render();
</script>
</body>
</html>
